[project]
name = "remote-settings-safebrowsing-v5-rt-key-updater"
version = "0.1.0"
description = "Publish the SafeBrowsing V5 real-time OHTTP key config from Google to Remote Settings"
authors = [
    {name = "Tim Huang", email = "tihuang@mozilla.com"},
]
license = {text = "MPLv2"}
requires-python = "<4.0,>=3.12"
dependencies = [
    "kinto-http<12.0.0,>=11.8.0",
    "requests<3.0.0,>=2.32.0",
    "sentry-sdk<3.0.0,>=2.29.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff<1.0.0,>=0.11.12",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 99
extend-exclude = [
    "__pycache__",
    ".venv/",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # flake8
    "F",
    # isort
    "I",
]
ignore = [
    # `format` will wrap lines.
    "E501",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
