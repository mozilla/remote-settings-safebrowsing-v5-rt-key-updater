name: Continous Integration

on: pull_request

jobs:
  lint:
    name: Check code style and consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint
        run: make lint

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test
        run: make test

  integration-tests:
    name: Execute script against a real server
    runs-on: ubuntu-latest
    env:
      SERVER: "http://localhost:8888/v1"
      # Serve a captured key config locally, so that CI does not depend on Google.
      KEY_CONFIG_URL: "http://localhost:8000/v1/ohttp/hpkekeyconfig"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build ingestion job container
        run:
          docker build -t cronjob:test .
      - name: Run local Remote Settings server
        run: |
          docker run --detach \
            --network=host \
            --env KINTO_INI=config/testing.ini \
            mozilla/remote-settings
      - name: Run fake key config server
        run: |
          python3 - <<'EOF' &
          import base64
          from http.server import BaseHTTPRequestHandler, HTTPServer

          # Same sample as in test.py, captured from the Google endpoint.
          BODY = base64.b64decode("HQAgLPp299yewWibKwPaxVRye21WjLCpEU75A0vrhBqgqyoABAABAAI=")


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/ohttp-keys")
                  self.send_header("Content-Length", str(len(BODY)))
                  self.end_headers()
                  self.wfile.write(BODY)


          HTTPServer(("127.0.0.1", 8000), Handler).serve_forever()
          EOF
          curl --silent --fail --retry 5 --retry-connrefused --output /dev/null "${KEY_CONFIG_URL}"
      - name: Create collection
        run: |
          curl -X PUT http://localhost:8888/v1/buckets/main-workspace/collections/sbv5-rt-key

      - name: Run job from container
        run: |
          docker run -e SERVER="${SERVER}" \
            -e KEY_CONFIG_URL="${KEY_CONFIG_URL}" \
            --network=host \
            cronjob:test

      - name: Run job from source
        shell: bash
        run: |
          # The container run above already published the record.
          make start | tee output.txt
          grep --quiet "Records are in sync" output.txt
